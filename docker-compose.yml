services:
  buyer-anons:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buyer-anons-dev
    volumes:
      - ./src:/app/src:rw
      - ./tests:/app/tests:rw
      - ./output:/app/output:rw
    env_file:
      - .env
    ports:
      - "8080:8080"  # Для webhook Viber
    restart: unless-stopped
    # Для разработки - держим контейнер запущенным
    stdin_open: true
    tty: true
    command: ["python", "-m", "src.main"]
